name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      git_ref:
        description: "Branch, tag, or commit SHA to deploy"
        required: true
        default: main
        type: string
      production_confirmation:
        description: 'For production only, type "deploy-production"'
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Require Cloudflare deploy secrets
        shell: bash
        run: |
          [[ -n "${CLOUDFLARE_API_TOKEN}" ]] || { echo "Missing CLOUDFLARE_API_TOKEN secret."; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID}" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret."; exit 1; }

      - name: Guard production confirmation
        if: ${{ inputs.target == 'production' }}
        shell: bash
        run: |
          if [[ "${{ inputs.production_confirmation }}" != "deploy-production" ]]; then
            echo 'Production deploy blocked. Type "deploy-production" in the confirmation input.'
            exit 1
          fi

      - name: Guard production ref
        if: ${{ inputs.target == 'production' }}
        shell: bash
        run: |
          if [[ "${{ inputs.git_ref }}" != "main" ]]; then
            echo "Production deploys must use git_ref=main."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run verify gate
        run: npm run verify

      - name: Dry-run staging deploy
        if: ${{ inputs.target == 'staging' }}
        run: npx wrangler deploy --dry-run --env staging

      - name: Dry-run production deploy
        if: ${{ inputs.target == 'production' }}
        run: npx wrangler deploy --dry-run --env production

      - name: Deploy staging
        if: ${{ inputs.target == 'staging' }}
        run: npx wrangler deploy --env staging

      - name: Deploy production
        if: ${{ inputs.target == 'production' }}
        run: npx wrangler deploy --env production

      - name: Set health URL
        id: health
        shell: bash
        run: |
          if [[ "${{ inputs.target }}" == "production" ]]; then
            echo "url=https://nut-house-portal.henry-b22.workers.dev/api/health" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://nut-house-portal-staging.henry-b22.workers.dev/api/health" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke check deployed health endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "${{ steps.health.outputs.url }}"
